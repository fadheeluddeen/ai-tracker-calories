<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <!-- Shadow & Glow -->
    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Calorie Flame Ring (Red to Orange-Coral) -->
    <linearGradient id="cal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#ff6a20" />
      <stop offset="100%" stop-color="#ff9500" />
    </linearGradient>

    <!-- Protein Ring (Vivid Apple Mint-Green) -->
    <linearGradient id="pro-gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="60%" stop-color="#30d158" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Carbs / Water Ring (Aqua Electric Blue) -->
    <linearGradient id="carb-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <radialGradient id="lens-plate" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#f4f4f5" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#e4e4e7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d4d4d8" stop-opacity="0.6" />
    </radialGradient>

    <linearGradient id="lens-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Circular Glass Base Disc -->
  <circle cx="190" cy="190" r="180" fill="url(#lens-plate)" stroke="url(#lens-rim)" stroke-width="2" />

  <!-- Rings Container with 90 deg rotation for top-start standard -->
  <g transform="rotate(-90 190 190)">
    <!-- 1. Calorie Ring (Outer, r=142, stroke=22) -->
    <circle cx="190" cy="190" r="142" fill="none" stroke="#18181b" stroke-opacity="0.08" stroke-width="22" />
    <circle
      cx="190"
      cy="190"
      r="142"
      fill="none"
      stroke="url(#cal-gradient)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-dasharray="892"
      stroke-dashoffset="190"
      filter="url(#ring-glow)"
    />
    <circle cx="332" cy="190" r="5" fill="#ffffff" opacity="0.9" />

    <!-- 2. Protein Ring (Middle, r=108, stroke=19) -->
    <circle cx="190" cy="190" r="108" fill="none" stroke="#18181b" stroke-opacity="0.08" stroke-width="19" />
    <circle
      cx="190"
      cy="190"
      r="108"
      fill="none"
      stroke="url(#pro-gradient)"
      stroke-width="19"
      stroke-linecap="round"
      stroke-dasharray="678"
      stroke-dashoffset="170"
      filter="url(#ring-glow)"
    />
    <circle cx="298" cy="190" r="4" fill="#ffffff" opacity="0.85" />

    <!-- 3. Carbs Ring (Inner, r=76, stroke=17) -->
    <circle cx="190" cy="190" r="76" fill="none" stroke="#18181b" stroke-opacity="0.08" stroke-width="17" />
    <circle
      cx="190"
      cy="190"
      r="76"
      fill="none"
      stroke="url(#carb-gradient)"
      stroke-width="17"
      stroke-linecap="round"
      stroke-dasharray="477"
      stroke-dashoffset="95"
      filter="url(#ring-glow)"
    />
    <circle cx="266" cy="190" r="3.5" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Center Metric Disc -->
  <circle cx="190" cy="190" r="54" fill="#ffffff" fill-opacity="0.75" stroke="#ffffff" stroke-width="1.5" />
  <text x="190" y="178" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#71717a" text-anchor="middle">REMAINING</text>
  <text x="190" y="202" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="800" fill="#18181b" text-anchor="middle">1,420</text>
  <text x="190" y="216" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="700" fill="#a1a1aa" text-anchor="middle">KCAL</text>
</svg>
