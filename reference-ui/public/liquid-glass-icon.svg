<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="icon-shadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <linearGradient id="icon-glass" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="55%" stop-color="#fef1e6" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#fdd9b5" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="icon-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="icon-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#ff6b22" />
      <stop offset="100%" stop-color="#ff9500" />
    </linearGradient>

    <linearGradient id="icon-flame-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b22" />
      <stop offset="100%" stop-color="#ffb347" />
    </linearGradient>

    <linearGradient id="icon-flame-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffe4bc" />
    </linearGradient>
  </defs>

  <!-- Glass squircle badge -->
  <g filter="url(#icon-shadow)">
    <path
      d="M 256 24 C 384 24, 464 24, 488 48 C 512 72, 512 152, 512 256
         C 512 360, 512 440, 488 464 C 464 488, 384 488, 256 488
         C 128 488, 48 488, 24 464 C 0 440, 0 360, 0 256
         C 0 152, 0 72, 24 48 C 48 24, 128 24, 256 24 Z"
      fill="url(#icon-glass)"
      stroke="url(#icon-rim)"
      stroke-width="4"
    />
  </g>

  <!-- Single bold calorie ring -->
  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="176" fill="none" stroke="#18181b" stroke-opacity="0.08" stroke-width="30" />
    <circle
      cx="256" cy="256" r="176"
      fill="none"
      stroke="url(#icon-ring)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-dasharray="1106"
      stroke-dashoffset="190"
    />
  </g>

  <!-- Simple two-tone flame, centered -->
  <path
    d="M 266 148 C 308 184, 334 228, 330 270 C 326 314, 292 344, 256 344
       C 220 344, 186 314, 182 272 C 179 240, 198 208, 216 190
       C 213 212, 224 228, 238 226 C 250 224, 255 210, 250 196
       C 254 178, 259 162, 266 148 Z"
    fill="url(#icon-flame-outer)"
  />
  <path
    d="M 260 214 C 284 236, 296 256, 293 274 C 290 292, 274 304, 256 304
       C 238 304, 223 292, 220 274 C 218 260, 226 246, 240 234
       C 239 246, 246 254, 254 253 C 261 252, 265 244, 262 234
       C 261 227, 260 220, 260 214 Z"
    fill="url(#icon-flame-inner)"
  />

  <!-- Top specular highlight -->
  <path
    d="M 40 60 C 80 30, 180 24, 256 24 C 332 24, 432 30, 472 60
       C 486 74, 492 108, 494 150 C 360 184, 152 184, 18 150
       C 20 108, 26 74, 40 60 Z"
    fill="#ffffff"
    opacity="0.16"
  />
</svg>
