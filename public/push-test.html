<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plate Log — Push Test</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; background: #fff; color: #111; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: #666; font-size: 13px; margin: 0 0 20px; }
  button { margin-top: 16px; padding: 10px 16px; font-weight: 700; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  .row { margin-top: 20px; padding-top: 16px; border-top: 1px solid #ddd; }
  .error-box { margin-top: 12px; padding: 10px; border: 1px solid #c00; background: #fee; font-size: 13px; }
  .ok-box { margin-top: 12px; padding: 10px; border: 1px solid #2a2; background: #efe; font-size: 13px; }
</style>
</head>
<body>
  <h1>Push notifications (test)</h1>
  <p class="hint">Standalone page to prove the push pipeline works end to end. Gets folded into the real UI later.</p>

  <button id="enable-btn">Enable notifications</button>
  <div id="status"></div>

  <div class="row">
    <button id="test-btn" disabled>Send test notification</button>
  </div>

  <script>
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    const statusEl = document.getElementById('status');
    const testBtn = document.getElementById('test-btn');

    function setStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = ok ? 'ok-box' : 'error-box';
    }

    document.getElementById('enable-btn').addEventListener('click', async () => {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          throw new Error('Push notifications are not supported in this browser');
        }

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          throw new Error(`Notification permission: ${permission}`);
        }

        const registration = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        const { publicKey } = await fetch('/api/push/public-key').then((r) => r.json());
        if (!publicKey) throw new Error('server has no VAPID public key configured');

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });
        }

        const res = await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription.toJSON()),
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);

        setStatus('Subscribed. Tap "Send test notification" to try it.', true);
        testBtn.disabled = false;
      } catch (err) {
        setStatus(err.message, false);
      }
    });

    testBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/push/test', { method: 'POST' });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
        const data = await res.json();
        setStatus(`Sent to ${data.sent} subscription(s) — check your device.`, true);
      } catch (err) {
        setStatus(err.message, false);
      }
    });
  </script>
</body>
</html>
